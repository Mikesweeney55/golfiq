name: GolfRecon Maintenance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recon-tweaks.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        env:
          OLD_BLOCK: 
          NEW_BLOCK: 
        run: python -c "import os,base64,pathlib; p=pathlib.Path('index.html'); s=p.read_text(); old=base64.b64decode(os.environ['OLD_BLOCK']).decode(); new=base64.b64decode(os.environ['NEW_BLOCK']).decode(); assert old in s; assert '<title>GolfRecon v12.0 Beta</title>' in s; s=s.replace(old,new,1).replace('<title>GolfRecon v12.0 Beta</title>','<title>GolfRecon v12.1 Beta</title>',1); p.write_text(s)"
      - name: Verify
        run: grep -q 'async function setGlobalCourse(id)' index.html && grep -q 'GolfRecon v12.1 Beta' index.html && git diff --check
      - name: Commit
        run: git config user.name github-actions-bot && git config user.email actions@github.com && git add index.html && git commit -m 'Fix Pregame refresh and bump v12.1' && git push
