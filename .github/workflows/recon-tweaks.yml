name: GolfRecon Maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recon-tweaks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified Pregame refresh fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""function setGlobalCourse(id){
  if(!db.courses.some(c=>c.id===id))return;
  state.selectedCourseId=id;
  state.gameCourseId=id;
  state.roundCourseId=id;
  state.selectedRoundId=null;
  try{localStorage.setItem('golfreconSelectedCourseId',id)}catch{}
  refreshGlobalCourseSelector();
  render();
}"""
          new="""async function setGlobalCourse(id){
  if(!db.courses.some(c=>c.id===id))return;
  state.selectedCourseId=id;
  state.gameCourseId=id;
  state.roundCourseId=id;
  state.selectedRoundId=null;
  try{localStorage.setItem('golfreconSelectedCourseId',id)}catch{}
  refreshGlobalCourseSelector();
  render();

  try{
    const data=await callImportFunction({action:'bootstrap'});
    db.player=data.player||db.player;
    db.swingThoughts=data.swingThoughts||db.swingThoughts;
    db.courses=data.courses||db.courses;
    db.rounds=data.rounds||db.rounds;
    db.puttingDetails=data.puttingDetails||db.puttingDetails;
    db.clubStats=data.clubStats||db.clubStats;
    if(!db.courses.some(c=>c.id===id)) state.selectedCourseId=db.courses[0]?.id||null;
    if(state.gameCourseId!=='all') state.gameCourseId=state.selectedCourseId;
    if(state.roundCourseId!=='all') state.roundCourseId=state.selectedCourseId;
    refreshGlobalCourseSelector();
    render();
  }catch(e){
    console.warn('Course refresh failed; using current synced data',e);
  }
}"""
          if old not in s:
              raise SystemExit('Verified setGlobalCourse block not found; refusing to modify file')
          if '<title>GolfRecon v12.0 Beta</title>' not in s:
              raise SystemExit('Expected v12.0 title not found; refusing to modify file')
          s=s.replace(old,new,1)
          s=s.replace('<title>GolfRecon v12.0 Beta</title>','<title>GolfRecon v12.1 Beta</title>',1)
          p.write_text(s)
          PY
      - name: Verify exact changes
        shell: bash
        run: |
          grep -q "async function setGlobalCourse(id)" index.html
          grep -q "const data=await callImportFunction({action:'bootstrap'})" index.html
          grep -q "<title>GolfRecon v12.1 Beta</title>" index.html
          git diff --check
      - name: Commit app change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Pregame course refresh and bump v12.1"
          git push
