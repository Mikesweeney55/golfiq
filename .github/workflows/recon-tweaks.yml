name: GolfRecon Maintenance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recon-tweaks.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()

          assert "<title>GolfRecon v12.2 Beta</title>" in s
          assert "<span>v12.2 Beta</span>" in s
          s=s.replace("<title>GolfRecon v12.2 Beta</title>","<title>GolfRecon v12.3 Beta</title>",1)
          s=s.replace("<span>v12.2 Beta</span>","<span>v12.3 Beta</span>",1)

          start=s.index('<div class="section-head"><div><div class="eyebrow">ROUND LIST</div>')
          end=s.index('\n ${selectedCourse?courseMemorySection(selectedCourse.id):\'\'}`;',start)
          new='''<div class="section-head"><div><div class="eyebrow">ROUND LIST</div><h2>${selectedCourse?(selectedCourse.baseName||selectedCourse.name):'Score by round'}</h2></div></div><div class="card">${sorted.map(r=>{const c=course(r.courseId),diff=scoreDifferential(r),sel=String(state.selectedRoundId)===String(r.id),g=missingRoundStats(r),basicMissing=g.fw+g.gir+g.putts,status=basicMissing?`<span class="round-status missing">Missing stats</span>`:g.firstPutts?`<span class="round-status warn">Putt detail missing</span>`:`<span class="round-status complete">Complete ✓</span>`;return `<div class="round-row round-summary has-edit ${sel?'selected':''}" data-round-row="${r.id}"><div><strong>${c.name}</strong><div class="muted">${fmtDate(r.date)} · ${c.tees} tees · Par ${c.par??'—'} · ${r.holes} holes</div><div class="round-status-row">${status}</div></div><div class="score-big">${r.gross}${sel&&Number.isFinite(c.par)?`<span class="score-over">${r.gross-c.par>=0?'+':''}${r.gross-c.par}</span>`:''}</div><div><span class="badge">Diff ${diff==null?'—':diff.toFixed(1)}</span></div><button class="edit-round-btn" data-round-action="${r.id}" type="button">Edit</button></div>`}).join('')}</div>'''
          s=s[:start]+new+s[end:]

          swing_start=s.index('\n <div class="section-head"><div><div class="eyebrow">SWING THOUGHTS</div><h2>My Game Keys</h2></div></div>')
          swing_end=s.index('\n <div class="game-filter-block">',swing_start)
          swing=s[swing_start:swing_end]
          s=s[:swing_start]+s[swing_end:]
          shot_anchor='\n <div class="mygame-accuracy">'
          shot_pos=s.index(shot_anchor)
          s=s[:shot_pos]+swing+'\n'+s[shot_pos:]

          css_anchor='.edit-round-btn:hover{border-color:rgba(184,234,104,.45)}'
          assert css_anchor in s
          css='''.edit-round-btn:hover{border-color:rgba(184,234,104,.45)}
          .round-status-row{margin-top:6px}
          .round-status{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900;letter-spacing:.01em;border:1px solid var(--line)}
          .round-status.complete{color:var(--accent);background:rgba(184,234,104,.07);border-color:rgba(184,234,104,.22)}
          .round-status.warn{color:#ffd66b;background:rgba(255,214,107,.07);border-color:rgba(255,214,107,.22)}
          .round-status.missing{color:#ff9b96;background:rgba(255,59,48,.07);border-color:rgba(255,59,48,.20)}'''
          s=s.replace(css_anchor,css,1)

          p.write_text(s)
          PY
      - name: Verify
        run: grep -q 'GolfRecon v12.3 Beta' index.html && grep -q '<span>v12.3 Beta</span>' index.html && grep -q 'Putt detail missing' index.html && grep -q 'Complete ✓' index.html
      - name: Commit
        run: git config user.name github-actions-bot && git config user.email actions@github.com && git add index.html && git commit -m 'Clean round status and reposition swing thoughts for v12.3' && git push
