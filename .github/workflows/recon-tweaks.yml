name: GolfRecon Maintenance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recon-tweaks.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        env:
          SCRIPT_B64: 
        run: python -c "import os,base64; exec(base64.b64decode(os.environ['SCRIPT_B64']).decode())"
      - name: Verify
        run: grep -q 'GolfRecon v12.2 Beta' index.html && grep -q '<span>v12.2 Beta</span>' index.html && grep -q '<h2>Platoons & Leagues</h2>' index.html && git diff --check
      - name: Commit
        run: git config user.name github-actions-bot && git config user.email actions@github.com && git add index.html && git commit -m 'Polish Pregame and putting UI for v12.2' && git push
