name: GolfRecon Maintenance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recon-tweaks.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v12.2 UI cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          replacements=[
            ('<title>GolfRecon v12.1 Beta</title>','<title>GolfRecon v12.2 Beta</title>'),
            ('<div class="brand-meta"><span>v12.0 Beta</span>','<div class="brand-meta"><span>v12.2 Beta</span>'),
            ('<div class="muted" style="font-size:11px;margin-top:8px">Scorecard symbols: circle birdie · square bogey · double outline double bogey · no outline par</div>',''),
            ('<div class="card"><div class="eyebrow">PUTTING BY DISTANCE</div><h3 style="margin-top:4px">Outcome mix</h3>','<div class="card"><div class="eyebrow">PUTTING BY DISTANCE</div><h3 style="margin-top:4px">Results</h3>'),
            ('<div class="card" style="margin-top:12px"><div class="eyebrow">PRACTICE PLAN</div><h3 style="margin-top:4px">Where to spend your putting time</h3>','<div class="card" style="margin-top:12px"><div class="eyebrow">PRACTICE PLAN</div><h3 style="margin-top:4px">Focus</h3>'),
            ('<div class="putt-stack-count">${z.n} greens</div>','<div class="putt-stack-count">${z.n}</div>'),
            ('<h2>Groups & Leagues</h2>','<h2>Platoons & Leagues</h2>'),
            ('home for recurring groups, league seasons, events, standings, previews, recaps and shareable trash talk.','home for platoons, leagues, events, standings, previews and recaps.')
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit('Expected text not found: '+old[:100])
            s=s.replace(old,new,1)

          old='''    ${gameKeysPregameHtml()}

    ${pregameTendencies(c)}

    <div class="section-head"><div><div class="eyebrow">3 INSIGHTS · LAST ${Math.min(3,rounds.length)||0} HERE</div><h2>What matters tomorrow</h2></div></div>
    <div class="card key-list">${keys.map((k,i)=>`<div class="key"><div class="key-num">${i+1}</div><div><strong>${k.title}</strong><span class="muted">${k.text}</span></div></div>`).join('')}</div>

    ${pregameChatHtml(c)}'''
          new='''    <div class="section-head"><div><div class="eyebrow">3 INSIGHTS · LAST ${Math.min(3,rounds.length)||0} HERE</div><h2>What matters tomorrow</h2></div></div>
    <div class="card key-list">${keys.map((k,i)=>`<div class="key"><div class="key-num">${i+1}</div><div><strong>${k.title}</strong><span class="muted">${k.text}</span></div></div>`).join('')}</div>

    ${gameKeysPregameHtml()}

    ${pregameTendencies(c)}

    ${pregameChatHtml(c)}'''
          if old not in s:
            raise SystemExit('Pregame ordering block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'GolfRecon v12.2 Beta' index.html
          grep -q '<span>v12.2 Beta</span>' index.html
          grep -q '<h2>What matters tomorrow</h2>' index.html
          grep -q '<h2>Platoons & Leagues</h2>' index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Polish Pregame and putting UI for v12.2'
          git push
