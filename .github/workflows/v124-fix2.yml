name: GolfRecon v12.5 Stat Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v124-fix2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          assert '<title>GolfRecon v12.4 Beta</title>' in s
          assert '<span>v12.4 Beta</span>' in s
          s=s.replace('<title>GolfRecon v12.4 Beta</title>','<title>GolfRecon v12.5 Beta</title>',1)
          s=s.replace('<span>v12.4 Beta</span>','<span>v12.5 Beta</span>',1)

          old="function validBinaryStat(v){return v===true||v===false||v===1||v===0}"
          new="""function binaryStatValue(v){
            if(v===true||v===1||v==='1')return 1;
            if(v===false||v===0||v==='0')return 0;
            const x=String(v??'').trim().toLowerCase();
            if(x==='true'||x==='hit')return 1;
            if(x==='false'||x==='miss')return 0;
            return null;
          }
          function validBinaryStat(v){return binaryStatValue(v)!=null}"""
          assert old in s
          s=s.replace(old,new,1)

          old_gir="gir:{label:'Greens in regulation',short:'GIR',domain:[0,100],value:r=>{const a=(r.gir||[]).filter(validBinaryStat);return a.length?100*sum(a)/a.length:null},better:'high',fmt:v=>Math.round(v)+'%'},"
          new_gir="gir:{label:'Greens in regulation',short:'GIR',domain:[0,100],value:r=>{const a=(r.gir||[]).map(binaryStatValue).filter(v=>v!=null);return a.length?100*sum(a)/a.length:null},better:'high',fmt:v=>Math.round(v)+'%'},"
          old_fw="fairways:{label:'Fairways hit',short:'Fairways',domain:[0,100],value:r=>{const a=(r.fairways||[]).filter(validBinaryStat);return a.length?100*sum(a)/a.length:null},better:'high',fmt:v=>Math.round(v)+'%'},"
          new_fw="fairways:{label:'Fairways hit',short:'Fairways',domain:[0,100],value:r=>{const a=(r.fairways||[]).map(binaryStatValue).filter(v=>v!=null);return a.length?100*sum(a)/a.length:null},better:'high',fmt:v=>Math.round(v)+'%'},"
          assert old_gir in s and old_fw in s
          s=s.replace(old_gir,new_gir,1).replace(old_fw,new_fw,1)
          p.write_text(s)
          PY
      - name: Verify
        run: grep -q 'GolfRecon v12.5 Beta' index.html && grep -q 'binaryStatValue' index.html && grep -q 'map(binaryStatValue)' index.html
      - name: Commit
        run: git config user.name github-actions-bot && git config user.email actions@github.com && git add index.html && git commit -m 'Normalize FIR GIR values for v12.5' && git push
