name: GolfRecon v12.7 Directional Review UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v124-fix2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          assert '<title>GolfRecon v12.6 Beta</title>' in s
          assert '<span>v12.6 Beta</span>' in s
          s=s.replace('<title>GolfRecon v12.6 Beta</title>','<title>GolfRecon v12.7 Beta</title>',1)
          s=s.replace('<span>v12.6 Beta</span>','<span>v12.7 Beta</span>',1)

          marker='function reviewHtml(x){'
          helper=r'''function directionalReviewHtml(r){
  const pct=v=>v===null||v===undefined||v===''?'—':`${Number(v).toFixed(Number(v)%1?1:0)}%`;
  const fd=r?.fairway_distribution, gd=r?.gir_distribution;
  if(!fd && !gd)return '';
  const row=(label,v)=>`<div class="import-kpi"><div class="k">${label}</div><div class="v">${pct(v)}</div></div>`;
  return `<div class="section-head" style="margin-top:16px"><div><div class="eyebrow">DIRECTIONAL DATA</div><h3>Miss patterns found</h3></div></div>
    ${fd?`<div class="backfill-note" style="margin-bottom:8px"><strong>Fairways</strong></div><div class="import-summary">${row('Hit',fd.hit_pct)}${row('Left',fd.left_pct)}${row('Right',fd.right_pct)}${row('Short',fd.short_pct)}${row('Long',fd.long_pct)}</div>`:''}
    ${gd?`<div class="backfill-note" style="margin:12px 0 8px"><strong>GIR</strong></div><div class="import-summary">${row('Hit',gd.hit_pct)}${row('Short',gd.short_pct)}${row('Left',gd.left_pct)}${row('Right',gd.right_pct)}${row('Long',gd.long_pct)}${row('Other',gd.other_pct)}</div>`:''}`;
}
'''
          assert marker in s
          s=s.replace(marker,helper+marker,1)

          needle="    ${holes.length?`<div style=\"overflow-x:auto\"><table class=\"import-hole-table\">"
          assert needle in s
          s=s.replace(needle,"    ${directionalReviewHtml(r)}\n"+needle,1)
          p.write_text(s)
          PY
      - name: Verify
        run: grep -q 'GolfRecon v12.7 Beta' index.html && grep -q 'DIRECTIONAL DATA' index.html && grep -q 'directionalReviewHtml(r)' index.html
      - name: Commit
        run: git config user.name github-actions-bot && git config user.email actions@github.com && git add index.html && git commit -m 'Show directional data in backfill review for v12.7' && git push
