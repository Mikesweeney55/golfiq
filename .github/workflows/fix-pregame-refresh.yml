name: Fix Pregame Course Refresh
on:
  push:
    paths:
      - '.github/workflows/fix-pregame-refresh.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch course switching to refresh latest database data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""function setGlobalCourse(id){
  if(!db.courses.some(c=>c.id===id))return;
  state.selectedCourseId=id;
  state.gameCourseId=id;
  state.roundCourseId=id;
  state.selectedRoundId=null;
  try{localStorage.setItem('golfreconSelectedCourseId',id)}catch{}
  refreshGlobalCourseSelector();
  render();
}"""
          if old not in s:
              # Backward compatibility if the storage key stayed golfiq after the branding pass.
              old="""function setGlobalCourse(id){
  if(!db.courses.some(c=>c.id===id))return;
  state.selectedCourseId=id;
  state.gameCourseId=id;
  state.roundCourseId=id;
  state.selectedRoundId=null;
  try{localStorage.setItem('golfiqSelectedCourseId',id)}catch{}
  refreshGlobalCourseSelector();
  render();
}"""
          new="""async function setGlobalCourse(id){
  if(!db.courses.some(c=>c.id===id))return;
  state.selectedCourseId=id;
  state.gameCourseId=id;
  state.roundCourseId=id;
  state.selectedRoundId=null;
  try{localStorage.setItem('golfreconSelectedCourseId',id)}catch{}
  refreshGlobalCourseSelector();
  render();

  // Silently refresh from Supabase so Pregame always uses the newest rounds/stats
  // for the newly selected course instead of only the in-memory snapshot.
  try{
    const data=await callImportFunction({action:'bootstrap'});
    db.player=data.player||db.player;
    db.swingThoughts=data.swingThoughts||db.swingThoughts;
    db.courses=data.courses||db.courses;
    db.rounds=data.rounds||db.rounds;
    db.puttingDetails=data.puttingDetails||db.puttingDetails;
    db.clubStats=data.clubStats||db.clubStats;
    if(!db.courses.some(c=>c.id===id)){
      state.selectedCourseId=db.courses[0]?.id||null;
    }
    if(state.gameCourseId!=='all')state.gameCourseId=state.selectedCourseId;
    if(state.roundCourseId!=='all')state.roundCourseId=state.selectedCourseId;
    refreshGlobalCourseSelector();
    render();
  }catch(e){
    console.warn('Course refresh failed; using current synced data',e);
  }
}"""
          if old not in s:
              raise SystemExit('Could not find setGlobalCourse block; no changes made')
          s=s.replace(old,new,1)
          # Normalize the selected-course storage key while keeping backwards compatibility on load.
          s=s.replace("savedCourse=localStorage.getItem('golfiqSelectedCourseId')","savedCourse=localStorage.getItem('golfreconSelectedCourseId')||localStorage.getItem('golfiqSelectedCourseId')")
          p.write_text(s)
          PY
      - name: Sanity-check database wiring
        run: |
          grep -q "action:'bootstrap'" index.html
          grep -q "action:'save'" index.html
          grep -q "action:'update'" index.html
          grep -q "action:'delete'" index.html
          grep -q "puttingDetails" index.html
          grep -q "db.rounds" index.html
      - name: Commit fix
        run: |
          git config user.name "Mikesweeney55"
          git config user.email "Mikesweeney55@yahoo.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh Pregame data when switching courses"
          git push
