name: GolfRecon v12.4 Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v124-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        env:
          SCRIPT_B64: 楲 sbmV3X2Z3LDEpCnAud3JpdGVfdGV4dChzKQo=
        run: python -c "import os,base64; exec(base64.b64decode(os.environ['SCRIPT_B64']).decode())"
      - name: Verify
        run: grep -q 'GolfRecon v12.4 Beta' index.html && grep -q 'function validBinaryStat' index.html
      - name: Commit
        run: git config user.name github-actions-bot && git config user.email actions@github.com && git add index.html && git commit -m 'Fix missing FIR and GIR detection for v12.4' && git push
