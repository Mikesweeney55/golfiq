  <style>

}

.button{border:0;border-radius:13px;padding:11px 15px;font-weight:800}.button.primary{background:var(--accent);color:#15200f}.button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:rgba(21,32,28,.92);border:1px solid var(--line);border-radius:20px;padding:18px}.card h3{margin-bottom:6px}.metric{font-size:30px;font-weight:850;letter-spacing:-.04em}.metric-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{border:1px solid var(--line);background:#13211b;border-radius:999px;padding:7px 10px;color:#dbe5e0;font-size:13px}.chip.good{border-color:#315d46;color:var(--good)}.chip.warn{border-color:#6c5a2c;color:var(--warning)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 10px}.section-head h2{margin:0;font-size:20px}.section-head p{margin:0}.course-select{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.course-pill{white-space:nowrap;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px}.course-pill.active{background:var(--accent);color:#14200f;border-color:var(--accent)}
.key-list{display:grid;gap:10px}.key{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.key:last-child{border-bottom:0}.key-num{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#21372d;color:var(--accent);font-weight:900;flex:0 0 auto}.key strong{display:block;margin-bottom:3px}
.hole-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.hole-card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;position:relative}.hole-card.risk-low{border-color:#23c552}.hole-card.risk-medium{border-color:#f2d335}.hole-card.risk-high{border-color:#ff4d4f}.hole-top{display:flex;justify-content:space-between;align-items:center}.hole-number{font-size:22px;font-weight:900}.risk-dot{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:900;line-height:1;background:var(--good);color:#06210d;border:2px solid rgba(255,255,255,.22)}.risk-medium .risk-dot{background:var(--warning);color:#2a2200}.risk-high .risk-dot{background:var(--danger);color:#fff}.hole-score{font-size:18px;font-weight:800;margin-top:8px}.history{color:var(--muted);font-size:12px;margin-top:4px}.strategy{margin-top:9px;color:#dce6e1;font-size:13px}.risk-legend{display:flex;gap:8px;flex-wrap:wrap}.risk-legend .chip{display:inline-flex;align-items:center;gap:8px}.risk-legend .risk-dot{width:22px;height:22px;font-size:11px;flex:0 0 auto}
.round-row{display:grid;grid-template-columns:1.3fr .7fr .5fr .7fr;gap:8px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.round-row:last-child{border-bottom:0}.score-big{font-size:22px;font-weight:900}.badge{display:inline-flex;align-items:center;justify-content:center;min-width:52px;border-radius:999px;padding:5px 8px;background:#24352e;color:#dce8e2;font-size:12px}.score-strip{display:flex;gap:5px;overflow-x:auto;padding:8px 0}
.score-box{min-width:34px;height:34px;display:grid;place-items:center;background:transparent;border:0;font-weight:900;position:relative;color:var(--text)}
.score-box.birdie{border:2px solid #dfe9e3;border-radius:50%}
.score-box.eagle{border:2px solid #dfe9e3;border-radius:50%;box-shadow:0 0 0 3px #16221d,0 0 0 5px #dfe9e3}
.score-box.bogey{border:2px solid #dfe9e3;border-radius:0}
.score-box.double{border:2px solid #dfe9e3;border-radius:0;box-shadow:0 0 0 3px #16221d,0 0 0 5px #dfe9e3}
.score-box.worse{border:2px solid #ff8b7a;border-radius:0;box-shadow:0 0 0 3px #16221d,0 0 0 5px #ff8b7a}
.pregame-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.pregame-stat{border:1px solid var(--line);background:#13211b;border-radius:14px;padding:9px 8px;text-align:center}
.pregame-stat strong{display:block;font-size:18px;line-height:1.1}.pregame-stat span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.hole-stats{margin-top:10px;border-top:1px solid var(--line)}
.hole-stat-row{display:grid;grid-template-columns:38px repeat(4,minmax(0,1fr));gap:3px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px}
.hole-stat-row:last-child{border-bottom:0}
.hole-stat-row .row-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.hole-stat{text-align:center;min-width:0}
.hole-stat strong{display:block;font-size:12px;line-height:1.05}
.hole-stat span{display:block;color:var(--muted);font-size:9px;line-height:1.1;margin-top:2px}
.hole-insight{margin-top:8px;font-size:11px;color:#dce6e1;line-height:1.3}
.stat-check{color:#23c552;font-weight:950;font-size:15px;line-height:1}
.stat-x{color:#ff4d4f;font-weight:950;font-size:15px;line-height:1}
.course-stat-lines{margin-top:14px;border:1px solid var(--line);background:#13211b;border-radius:14px;padding:2px 10px}
.course-stat-row{display:grid;grid-template-columns:38px repeat(4,minmax(0,1fr));gap:3px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.course-stat-row:last-child{border-bottom:0}
.course-stat-row .row-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.course-stat{text-align:center;min-width:0}
.course-stat strong{display:block;font-size:14px;line-height:1.05}
.course-stat span{display:block;color:var(--muted);font-size:9px;line-height:1.1;margin-top:2px}
.priority-tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin-top:7px}
.priority-tag.protect{background:rgba(255,77,79,.14);color:#ff8a8c;border:1px solid rgba(255,77,79,.38)}
.priority-tag.confidence{background:rgba(35,197,82,.13);color:#6fe18f;border:1px solid rgba(35,197,82,.35)}
.score-over{font-size:12px;color:var(--muted);font-weight:850;margin-left:5px;white-space:nowrap}


.stat-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.stat-tab{white-space:nowrap;border:1px solid var(--line);background:#13211b;color:#dbe5e0;border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px}.stat-tab.active{background:var(--accent);color:#14200f;border-color:var(--accent)}
.chart-card{padding:16px 14px 12px}.chart-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}.chart-head strong{font-size:18px}.chart-head .muted{font-size:12px}.round-chart-wrap{overflow-x:auto;padding:6px 2px 2px;scroll-behavior:smooth}.round-chart{height:240px;min-width:max(100%,calc(var(--bars,12) * 44px));display:flex;align-items:stretch;gap:6px;border-bottom:1px solid var(--line);padding:0 4px}.bar-col{width:38px;flex:0 0 38px;display:grid;grid-template-rows:1fr 52px;gap:4px;align-items:end}.bar-track{height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}.bar{width:28px;min-height:4px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,var(--accent),var(--accent2));box-shadow:0 0 0 1px rgba(255,255,255,.03) inset}.bar-value{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:#e8efe9;white-space:nowrap}.bar-label{text-align:center;font-size:10px;color:var(--muted);line-height:1.15}.bar-label strong{display:block;color:#dbe5e0;font-size:10px;white-space:nowrap}.chart-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chart-summary .badge{min-width:auto}
.bottom-nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);background:rgba(18,27,24,.95);backdrop-filter:blur(14px);border:1px solid rgba(207,232,219,.42);outline:1px solid rgba(255,255,255,.08);border-radius:20px;padding:7px;box-shadow:0 10px 28px rgba(0,0,0,.32),0 0 0 1px rgba(167,210,188,.10),0 0 14px rgba(167,210,188,.12)}.nav-item{border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:14px}.nav-item span{display:block;font-size:18px}.nav-item small{font-size:11px}.nav-item.active{background:#24342e;color:var(--text)}
dialog{border:0;padding:0;background:transparent;color:var(--text);width:min(620px,calc(100% - 28px))}dialog::backdrop{background:rgba(0,0,0,.72)}.dialog-card{background:#16221d;border:1px solid var(--line);border-radius:22px;padding:22px}.dialog-head{display:flex;justify-content:space-between;align-items:flex-start}.icon-button{border:0;background:transparent;color:var(--text);font-size:20px}.upload-zone{display:grid;gap:4px;text-align:center;border:1px dashed #52685d;border-radius:18px;padding:26px;margin:18px 0;background:#111b17}.upload-zone input{display:none}.upload-zone span{font-size:12px;color:var(--muted)}label{display:grid;gap:6px;margin-top:12px;color:#dbe5e0;font-weight:700}input,select{background:#0e1714;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.file-list{display:grid;gap:6px}.file-item{font-size:12px;color:var(--muted);padding:7px 9px;background:#101914;border-radius:10px}
.note{border-left:3px solid var(--accent);padding-left:12px;color:#dce7e2}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:700px){.app-shell{padding:14px 12px 98px}.hero{padding:20px}.hero h2{font-size:28px}.grid.two,.grid.three{grid-template-columns:1fr 1fr}.hole-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.round-row{grid-template-columns:1.2fr .6fr .6fr}.round-row .optional{display:none}}


.filter-tabs,.game-tabs,.putting-rounds{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.filter-tab,.game-tab,.putting-round{white-space:nowrap;border:1px solid var(--line);background:#13211b;color:#dbe5e0;border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px}
.filter-tab.active,.game-tab.active,.putting-round.active{background:var(--accent);color:#14200f;border-color:var(--accent)}
.chart-scale{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px}
.y-axis{height:240px;display:flex;flex-direction:column;justify-content:space-between;padding:3px 0 52px;color:var(--muted);font-size:10px;text-align:right}
.round-chart.true-scale{position:relative;background-image:linear-gradient(to top,transparent 24%,rgba(255,255,255,.04) 25%,transparent 26%,transparent 49%,rgba(255,255,255,.04) 50%,transparent 51%,transparent 74%,rgba(255,255,255,.04) 75%,transparent 76%)}
.nine-marker{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warning);margin-left:3px;vertical-align:middle}
.putting-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.putting-green{position:relative;max-width:700px;margin:14px auto 2px;aspect-ratio:1.06/1;border-radius:46% 46% 40% 40%;overflow:hidden;border:7px solid #244e25;background:radial-gradient(ellipse at 50% 28%,#b7e681 0 20%,#9dd66c 21% 46%,#75bd4e 47% 72%,#3f8f38 73% 100%);box-shadow:inset 0 0 50px rgba(0,0,0,.28)}
.heat-ring{position:absolute;left:50%;transform:translateX(-50%);border:3px solid rgba(255,255,255,.86);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;color:#0e1714;font-weight:800;padding:4px;overflow:hidden}.heat-ring>div{max-width:86%;line-height:1.05}
.heat-ring .zone-title{font-size:17px;line-height:1}.heat-ring .zone-detail{font-size:11px;line-height:1.05;margin-top:3px;font-weight:800;white-space:nowrap}.heat-ring .zone-sg{font-size:12px;margin-top:2px;white-space:nowrap}

.zone1{top:5%;width:42%;height:27%;z-index:6}.zone2{top:22%;width:58%;height:34%;z-index:5}.zone3{top:42%;width:70%;height:30%;z-index:4}.zone4{top:55%;width:82%;height:31%;z-index:3}.zone5{top:68%;width:94%;height:28%;z-index:2}.zone6{top:81%;width:98%;height:18%;z-index:1}
.heat-excellent{background:rgba(20,111,38,.93);color:white}.heat-good{background:rgba(164,215,91,.93)}.heat-average{background:rgba(255,210,91,.94)}.heat-poor{background:rgba(235,112,82,.92);color:white}
.heat-key{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.heat-key .chip{display:flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.excellent{background:#146f26}.dot.good{background:#a4d75b}.dot.average{background:#ffd25b}.dot.poor{background:#eb7052}.dot.nodata{background:#bcbcbc}

@media(max-width:700px){.chart-scale{grid-template-columns:34px minmax(0,1fr)}.y-axis{font-size:9px}.putting-summary{grid-template-columns:1fr 1fr}.heat-ring .zone-title{font-size:12px}.heat-ring .zone-detail{font-size:9px}.heat-ring .zone-sg{font-size:10px}.zone6 .zone-title{font-size:11px}.zone6 .zone-detail{font-size:8px}}


.round-row.round-summary{grid-template-columns:minmax(180px,1fr) .35fr .55fr;border-radius:12px;padding-left:10px;padding-right:10px;transition:background .16s ease,box-shadow .16s ease}

/* GolfIQ mobile heat map v2: non-overlapping distance bands */

function weightedDistribution(courseId,key){
  const rs=roundsFor(courseId).filter(r=>r[key]);
  if(!rs.length)return null;
  const keys=key==='fairwayDistribution'
    ?['hitPct','missLeftPct','missRightPct','missShortPct','missLongPct','missFairwaysHitPct']
    :['hitPct','missShortPct','missLeftPct','missRightPct','missLongPct','missGirPct','noChancePct'];
  const totals=Object.fromEntries(keys.map(k=>[k,0]));
  let totalW=0;
  rs.forEach(r=>{
    const w=key==='fairwayDistribution'?(r.fairways||[]).filter(v=>v!=null).length:(r.gir||[]).filter(v=>v!=null).length;
    if(!w)return;
    totalW+=w;
    keys.forEach(k=>totals[k]+=(r[key][k]||0)*w);
  });
  if(!totalW)return null;
  keys.forEach(k=>totals[k]/=totalW);
  totals.rounds=rs.length;
  return totals;
}

function holeMemory(courseId){
  const c=course(courseId), rounds=roundsFor(courseId);
  if(!c?.pars?.length || c.pars.some(p=>!Number.isFinite(p)))return [];
  return c.pars.map((par,i)=>{
    const vals=rounds.map(r=>({score:r.scores[i],fw:r.fairways?.[i],gir:r.gir?.[i],putts:r.putts?.[i],chips:r.chips?.[i]})).filter(x=>x.score!=null);
    if(!vals.length) return null;
    const scores=vals.map(v=>v.score), over=scores.map(s=>s-par), avgScore=avg(scores);
    const doubleRate=Math.round(100*over.filter(x=>x>=2).length/scores.length);
    let risk='low'; if(avgScore-par>=1.3 || doubleRate>=40) risk='high'; else if(avgScore-par>=.7 || doubleRate>=20) risk='medium';
    const fwVals=vals.map(v=>v.fw).filter(v=>v!=null), girVals=vals.map(v=>v.gir).filter(v=>v!=null);
    const strategy=risk==='high'?'Respect this hole. Favor the safe side and remove the big number.':risk==='medium'?'Play to your normal target. Avoid forcing a recovery shot.':'Green-light hole. Stick with the plan that has worked.';
    return {hole:c.holeNumbers?.[i]??i+1,par,played:scores.length,avgScore,stdev:stddev(scores),best:Math.min(...scores),worst:Math.max(...scores),recent:scores,fw:pct(fwVals),gir:pct(girVals),putts:avg(vals.map(v=>v.putts).filter(v=>v!=null)),doubleRate,risk,strategy};
  }).filter(Boolean);
}

function scramblingPct(r){const c=course(r.courseId);let a=0,s=0;r.scores.forEach((score,i)=>{if(r.gir?.[i]===0){a++;if(score<=c.pars[i])s++;}});return a?100*s/a:null;}

function usefulHoleInsight(h){
  const bits=[];
  if(h.doubleRate>=40) bits.push(`${h.doubleRate}% double+`);
  if(h.gir!=null && h.gir<=25) bits.push(`GIR ${h.gir}%`);
  if(h.fw!=null && h.fw<=30 && h.par!==3) bits.push(`FH ${h.fw}%`);
  if(h.putts!=null && h.putts>=2.3) bits.push(`${h.putts.toFixed(1)} putts avg`);
  if(h.avgScore-h.par>=1.2 && !bits.length) bits.push(`+${(h.avgScore-h.par).toFixed(1)} vs par`);
  return bits.join(' · ');
}

function parTypeSummary(courseId,limit=3){
  const c=course(courseId);
  const rs=roundsFor(courseId).slice(0,limit);
  const by={3:[],4:[],5:[]};
  rs.forEach(r=>r.scores.forEach((s,i)=>{const p=c.pars[i]; if(by[p]) by[p].push(s-p);}));
  return Object.fromEntries(Object.entries(by).map(([p,v])=>[p,v.length?avg(v):null]));
}
function deepPregameInsights(courseId){
  const c=course(courseId), all=roundsFor(courseId), recent=all.slice(0,3), prior=all.slice(3);
  const recentAvg=recent.length?avg(recent.map(r=>r.gross)):null;
  const priorAvg=prior.length?avg(prior.map(r=>r.gross)):null;
  const mem=holeMemoryRecent(courseId,3);
  const worst=mem.slice().sort((a,b)=>(b.avgScore-b.par)-(a.avgScore-a.par))[0];
  const pars=parTypeSummary(courseId,3);
  const parEntries=Object.entries(pars).filter(([,v])=>v!=null).sort((a,b)=>b[1]-a[1]);
  const weakPar=parEntries[0];
  const scrVals=recent.map(scramblingPct).filter(v=>v!=null);
  const scr=scrVals.length?avg(scrVals):null;
  const girVals=recent.flatMap(r=>r.gir||[]).filter(v=>v!=null);
  const gir=girVals.length?pct(girVals):null;
  const putts=recent.length?avg(recent.map(r=>sum(r.putts))):null;

  const keys=[];
  if(recentAvg!=null){
    if(priorAvg!=null){
      const delta=recentAvg-priorAvg;
      keys.push({
        title: delta<=-1 ? 'You are scoring better here' : delta>=1 ? 'Recent scoring has slipped' : 'Scoring is holding steady',
        text:`Last ${recent.length}: ${recent.map(r=>r.gross).join(', ')} · ${Math.abs(delta).toFixed(1)} stroke${Math.abs(delta)>=1.95?'s':''} ${delta<0?'better':'worse'} than your earlier average.`
      });
    } else {
      keys.push({title:'Current scoring baseline',text:`Last ${recent.length}: ${recent.map(r=>r.gross).join(', ')} · ${recentAvg.toFixed(1)} average.`});
    }
  }
  if(worst){
    keys.push({
      title:`Hole ${worst.hole} is the clearest leak`,
      text:`Recent avg ${worst.avgScore.toFixed(1)} on par ${worst.par}${worst.doubleRate?` · ${worst.doubleRate}% double+`:''}. Treat bogey as acceptable if position gets shaky.`
    });
  }
  if(weakPar){
    const [p,over]=weakPar;
    const supporting = [`Par-${p}s are costing the most at +${over.toFixed(1)} per hole`];
    if(gir!=null) supporting.push(`GIR ${gir}%`);
    if(scr!=null) supporting.push(`scrambling ${Math.round(scr)}%`);
    if(putts!=null) supporting.push(`${putts.toFixed(1)} putts`);
    keys.push({title:`Your scoring pattern: par-${p}s`,text:supporting.join(' · ')+'.'});
  }
  while(keys.length<3) keys.push({title:'Keep the plan simple',text:'Not enough course-specific history yet for a deeper third trend.'});
  return keys.slice(0,3);
}


function courseRoundStats(courseId,mode='all'){
  const c=course(courseId), rs=roundsFor(courseId);
  const use=mode==='last'?rs.slice(0,1):rs;
  if(!use.length)return {score:null,fw:null,gir:null,putts:null};
  const fw=use.flatMap(r=>r.fairways||[]).filter(v=>v!=null);
  const gir=use.flatMap(r=>r.gir||[]).filter(v=>v!=null);
  const putts=use.map(r=>sum(r.putts||[])).filter(v=>v>0);
  return {
    score:mode==='last'?use[0].gross:avg(use.map(r=>r.gross)),
    fw:fw.length?pct(fw):null,
    gir:gir.length?pct(gir):null,
    putts:putts.length?avg(putts):null
  };
}
function priorityHoles(courseId){
  const c=course(courseId), mem=holeMemory(courseId);
  if(!mem.length)return [];
  const hcp=c.handicaps||[];
  const enriched=mem.map((h,i)=>{
    const holeHcp=hcp[i]??18;
    const hard=Math.max(0,(10-holeHcp)/9); // strongest weight on handicap 1-9 holes
    const over=h.avgScore-h.par;
    const protect=over*1.35+(h.doubleRate||0)/55+(h.gir!=null&&h.gir<30?.35:0);
    const confidence=hard*1.15+Math.max(0,.75-over)*1.05+(h.gir!=null&&h.gir>=50?.25:0);
    return {...h,holeHcp,protect,confidence};
  });
  const protect=enriched.slice().sort((a,b)=>b.protect-a.protect).slice(0,4)
    .map(h=>({...h,priorityType:'protect'}));
  const used=new Set(protect.map(h=>h.hole));
  const confidence=enriched.filter(h=>!used.has(h.hole)&&h.holeHcp<=9&&h.avgScore-h.par<=.85)
    .sort((a,b)=>b.confidence-a.confidence).slice(0,2)
    .map(h=>({...h,priorityType:'confidence'}));
  const selected=[...protect,...confidence];
  if(selected.length<6){
    const used2=new Set(selected.map(h=>h.hole));
    selected.push(...enriched.filter(h=>!used2.has(h.hole)).sort((a,b)=>b.protect-a.protect).slice(0,6-selected.length).map(h=>({...h,priorityType:'protect'})));
  }
  return selected.slice(0,6);
}


function safeText(s){
  return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function chatText(s){
  const escaped=safeText(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const lines=escaped.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let out='',inList=false;
  const closeList=()=>{if(inList){out+='</ul>';inList=false;}};
  for(const raw of lines){
    const line=raw.replace(/^[-–—]\s*[-–—]?\s*/,'- ');
    if(/^-\s+/.test(line)){
      if(!inList){out+='<ul>';inList=true;}
      out+=`<li>${line.replace(/^-\s+/,'')}</li>`;
      continue;
    }
    closeList();
    if(/^<strong>.*<\/strong>$/.test(line) || /^<strong>[^<]+:<\/strong>/.test(line)){
      out+=`<div class="chat-section">${line}</div>`;
    }else{
      out+=`<p>${line}</p>`;
    }
  }
  closeList();
  return out;
}

function scoreDifferential(r){
 const c=course(r.courseId);
 if(r.holes!==18 || !c)return null;
 let rating=c.rating,slope=c.slope;
 if((!Number.isFinite(rating)||!Number.isFinite(slope)) && isCalusaName(c.name||c.baseName)){
   const tee=romanTee(c.tees);
   const rs=tee?CALUSA_BLUE_TEE_RATINGS[tee]:null;
   if(rs){rating=rs.rating;slope=rs.slope}
 }
 if(!Number.isFinite(rating) || !Number.isFinite(slope) || !slope)return null;
 // WHS-like 18-hole estimate, using recorded gross as adjusted gross and PCC=0.
 return (r.gross-rating)*113/slope;
}

function weightedDistributionFromRounds(rs,key){
  const use=rs.filter(r=>r[key]);
  if(!use.length)return null;
  const keys=key==='fairwayDistribution'
    ?['hitPct','missLeftPct','missRightPct','missShortPct','missLongPct','missFairwaysHitPct']
    :['hitPct','missShortPct','missLeftPct','missRightPct','missLongPct','missGirPct','noChancePct'];
  const totals=Object.fromEntries(keys.map(k=>[k,0]));
  let totalW=0;
  use.forEach(r=>{
    const w=key==='fairwayDistribution'?(r.fairways||[]).filter(v=>v!=null).length:(r.gir||[]).filter(v=>v!=null).length;
    if(!w)return;
    totalW+=w;
    keys.forEach(k=>totals[k]+=(r[key][k]||0)*w);
  });
  if(!totalW)return null;
  keys.forEach(k=>totals[k]/=totalW);
  totals.rounds=use.length;
  return totals;
}

function cellTone(label,outcome){
  // Color means "how good is this result from this distance?"
  // It does NOT judge a complementary percentage in isolation.
  // Example: from 0–3 ft, a 2-putt is a bad outcome even when it happened 0% of the time.
  if(outcome==='3+') return 'bad';
  if(outcome==='1') return 'good';
  if(label==='0–3 ft') return 'bad';
  if(label==='4–6 ft') return 'ok';
  if(label==='7–10 ft') return 'ok';
  return 'good';
}

function heatMap(){
 const p=selectedPutting(),stats=puttingBandStats(p);
 const total=p.length,ones=p.filter(x=>x.putts===1).length,threes=p.filter(x=>x.putts>=3).length,best=stats.filter(x=>x.sg!=null).sort((a,b)=>b.sg-a.sg)[0];
 const ranked=stats.filter(z=>z.n>=3).map(z=>{
   const onePct=100*z.one/z.n,badPct=100*(z.three+z.four)/z.n;
   const shortPenalty=z.hi<=10?Math.max(0,55-onePct):Math.max(0,25-onePct)*.25;
   const threePenalty=badPct*(z.hi<=20?.7:1.15);
   const priority=shortPenalty+threePenalty;
   let why='';
   if(z.hi<=10 && onePct<55) why=`1-putt rate ${Math.round(onePct)}%`;
   else if(badPct>0) why=`3+ putts ${Math.round(badPct)}%`;
   else why=`${Math.round(onePct)}% 1-putt`;
   return {...z,priority,why};
 }).sort((a,b)=>b.priority-a.priority);
 const practice=ranked.filter(z=>z.priority>0).slice(0,3);
 const practiceHtml=practice.length?practice.map((z,i)=>`<div class="practice-item"><div class="practice-rank">${i+1}</div><div><strong>${z.label}</strong><div class="why">${z.why}</div></div><div class="practice-score">${z.priority>20?'High':z.priority>9?'Med':'Low'} focus</div></div>`).join(''):`<div class="muted">No clear putting weakness in the available sample.</div>`;

}

  const bitmap=await createImageBitmap(file);
  const scale=Math.min(1,maxDim/Math.max(bitmap.width,bitmap.height));
  const w=Math.max(1,Math.round(bitmap.width*scale)),h=Math.max(1,Math.round(bitmap.height*scale));
  const canvas=document.createElement('canvas'); canvas.width=w;canvas.height=h;
  canvas.getContext('2d').drawImage(bitmap,0,0,w,h);
  const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',quality));
  const buf=await blob.arrayBuffer();
  let binary=''; const bytes=new Uint8Array(buf),chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,Math.min(i+chunk,bytes.length)));
  return {name:file.name,type:'image/jpeg',data:btoa(binary)};
}
function val(v){return v===null||v===undefined||v===''?'—':v}
function boolMark(v){return v===true||v===1?'✓':v===false||v===0?'✕':'—'}
function reviewHtml(x){
  const r=x.round||x;
  const holes=r.holes_detail||r.hole_details||[];
  const warnings=[...(x.warnings||[]),...(r.warnings||[])];
  return `
    ${warnings.map(w=>`<div class="import-warning">${w}</div>`).join('')}
    <div class="import-summary">
      <div class="import-kpi"><div class="k">Course</div><div class="v">${val(r.course_name)}</div></div>
      <div class="import-kpi"><div class="k">Date</div><div class="v">${val(r.date)}</div></div>
      <div class="import-kpi"><div class="k">Tees</div><div class="v">${val(r.tees)}</div></div>
      <div class="import-kpi"><div class="k">Score</div><div class="v">${val(r.gross_score)}</div></div>
      <div class="import-kpi"><div class="k">Putts</div><div class="v">${val(r.total_putts)}</div></div>
      <div class="import-kpi"><div class="k">Fairways</div><div class="v">${val(r.fairways_hit)}</div></div>
      <div class="import-kpi"><div class="k">GIR</div><div class="v">${val(r.gir)}</div></div>
    </div>
    ${holes.length?`<div style="overflow-x:auto"><table class="import-hole-table"><thead><tr><th>Hole</th><th>Score</th><th>FH</th><th>GIR</th><th>Putts</th><th>1st putt</th></tr></thead><tbody>${holes.map(h=>`<tr><td>${val(h.hole)}</td><td>${val(h.score)}</td><td>${boolMark(h.fairway_hit)}</td><td>${boolMark(h.gir)}</td><td>${val(h.putts)}</td><td>${h.first_putt_distance_ft!=null?val(h.first_putt_distance_ft)+'′':'—'}</td></tr>`).join('')}</tbody></table></div>`:''}
    <div class="import-confidence">Extraction confidence: ${Math.round(100*(x.confidence??r.confidence??0))}%</div>`;
}
async function callImportFunction(payload){
  const res=await fetch(`${SUPABASE_URL}/functions/v1/golfiq-import`,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':`Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
      'apikey':SUPABASE_PUBLISHABLE_KEY
    },
    body:JSON.stringify(payload)
  });
  const body=await res.json().catch(()=>({error:'Invalid server response'}));
  if(!res.ok) throw new Error(body.error||body.message||`Import failed (${res.status})`);
  return body;
}
function slugify(s){
  return (s||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
function normalizeCourseName(s){
  return String(s||'')
    .toLowerCase()
    .replace(/&/g,' and ')
    .replace(/\bscottish\b/g,'scot')
    .replace(/\bcountry\s+club\b/g,'cc')
    .replace(/\bgolf\s+club\b/g,'')
    .replace(/\bgolf\s+course\b/g,'')
    .replace(/\bthe\b/g,'')
    .replace(/[^a-z0-9]+/g,' ')
    .trim()
    .replace(/\s+/g,' ');
}
function normalizeTee(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
}
function courseNameScore(a,b){
  const na=normalizeCourseName(a),nb=normalizeCourseName(b);
  if(!na||!nb)return 0;
  if(na===nb)return 100;
  if(na.includes(nb)||nb.includes(na))return 88;
  const A=new Set(na.split(' ')),B=new Set(nb.split(' '));
  const hit=[...A].filter(x=>B.has(x)).length;
  const union=new Set([...A,...B]).size;
  return union?100*hit/union:0;
}
function findCourseForImport(r){
  if(r.course_id){
    const exact=db.courses.find(c=>c.id===r.course_id);
    if(exact)return exact;
  }
  const incoming=r.course_name||'';
  const tee=normalizeTee(r.tees);
  const ranked=db.courses.map(c=>{
    const nameScore=Math.max(courseNameScore(incoming,c.name),courseNameScore(incoming,c.baseName));
    const teeScore=tee && normalizeTee(c.tees)===tee ? 12 : 0;
    return {c,score:nameScore+teeScore,nameScore,teeMatch:teeScore>0};
  }).filter(x=>x.nameScore>=58).sort((a,b)=>b.score-a.score);

  if(!ranked.length)return null;

  // If an explicit tee is present, never silently attach to the wrong tee.
  if(tee){
    const exactTee=ranked.find(x=>x.teeMatch);
    if(exactTee)return exactTee.c;
    return null;
  }
  return ranked[0].c;
}
function createCourseFromImport(r){
  const hd=(r.holes_detail||r.hole_details||[]).slice().sort((a,b)=>Number(a.hole)-Number(b.hole));
  const holes=Number(r.holes)||hd.length;
  if(!r.course_name || !holes)return null;

  const holeNumbers=hd.length?hd.map(h=>Number(h.hole)):Array.from({length:holes},(_,i)=>i+1);
  const pars=hd.length?hd.map(h=>h.par==null?null:Number(h.par)):Array(holes).fill(null);
  const handicaps=hd.length?hd.map(h=>h.handicap==null?null:Number(h.handicap)):Array(holes).fill(null);

  // We can safely create the course shell even if a few course-level fields are unknown.
  const par=Number.isFinite(Number(r.course_par))?Number(r.course_par):
            (pars.length && pars.every(Number.isFinite)?sum(pars):null);
  const rating=Number.isFinite(Number(r.course_rating))?Number(r.course_rating):null;
  const slope=Number.isFinite(Number(r.course_slope))?Number(r.course_slope):null;
  const segment=holes===18?'18 holes':(holeNumbers[0]===1?'Front 9':'9 holes');
  let id=slugify(`${r.course_name}-${r.tees||'tees'}-${segment}`);
  let n=2,base=id;
  while(db.courses.some(c=>c.id===id))id=`${base}-${n++}`;

  const c={
    id,name:r.course_name,baseName:r.course_name,tees:r.tees||'Unknown',
    yardage:0,slope,rating,par,pars,holeNumbers,handicaps,segment,imported:true
  };
  db.courses.push(c);
  return c;
}
function resolveCourseForImport(r){
  return ensureCalusaCourseForImport(r) || findCourseForImport(r) || createCourseFromImport(r);
}
function importSignature(r){
  return [
    r.date||r.played_on||'',
    (r.course_name||'').trim().toLowerCase(),
    r.gross_score??r.gross??'',
    r.holes??''
  ].join('|');
}
function embeddedRoundSignatures(){
  const sigs=new Set();
  db.rounds.forEach(r=>{
    const c=db.courses.find(x=>x.id===r.courseId);
    sigs.add([
      r.date||'',
      ((c?.baseName||c?.name||'')).trim().toLowerCase(),
      r.gross??'',
      r.holes??''
    ].join('|'));
  });
  return sigs;
}
function mergeImportedRound(parsed, importId){
  const r=parsed?.round;
  if(!r)return false;
  const c=resolveCourseForImport(r);
  if(!c)return {added:false,reason:'unmapped',courseName:r.course_name||'Unknown course'};

  const sig=[
    r.date||'',
    ((c.baseName||c.name||'')).trim().toLowerCase(),
    r.gross_score??'',
    r.holes??''
  ].join('|');

  const exists=db.rounds.some(x=>{
    const xc=db.courses.find(cc=>cc.id===x.courseId);
    return [
      x.date||'',
      ((xc?.baseName||xc?.name||'')).trim().toLowerCase(),
      x.gross??'',
      x.holes??''
    ].join('|')===sig;
  });
  if(exists)return {added:false,reason:'duplicate',course:c};

  const hd=r.holes_detail||[];
  const holes=r.holes || hd.length || c.holeNumbers?.length || 18;
  const arr=(key)=>Array.from({length:holes},(_,i)=>{
    const h=hd.find(x=>Number(x.hole)===Number(c.holeNumbers?.[i]??i+1)) || hd[i];
    return h?.[key] ?? null;
  });
  const boolArr=(key)=>arr(key).map(v=>v===true?1:v===false?0:null);

  const nextId=String(Math.max(0,...db.rounds.map(x=>Number(x.id)||0))+1);
  const nr={
    id:nextId,
    date:r.date,
    courseId:c.id,
    gross:r.gross_score,
    net:r.net_score,
    scoreToPar:(r.gross_score!=null && Number.isFinite(c.par))?r.gross_score-c.par:null,
    holes,
    scores:arr('score'),
    fairways:boolArr('fairway_hit'),
    gir:boolArr('gir'),
    putts:arr('putts'),
    chips:arr('chips'),
    sand:arr('sand'),
    penalties:arr('penalties'),
    source:r.source_app||'18Birdies',
    importConfidence:parsed.confidence??null,
    supabaseImportId:importId||null
  };
  if(r.fairway_distribution){
    nr.fairwayDistribution={
      hitPct:r.fairway_distribution.hit_pct,
      missLeftPct:r.fairway_distribution.left_pct,
      missRightPct:r.fairway_distribution.right_pct,
      missShortPct:r.fairway_distribution.short_pct,
      missLongPct:r.fairway_distribution.long_pct,
      missFairwaysHitPct:0
    };
  }
  if(r.gir_distribution){
    nr.girDistribution={
      hitPct:r.gir_distribution.hit_pct,
      missShortPct:r.gir_distribution.short_pct,
      missLeftPct:r.gir_distribution.left_pct,
      missRightPct:r.gir_distribution.right_pct,
      missLongPct:r.gir_distribution.long_pct,
      missGirPct:r.gir_distribution.other_pct,
      noChancePct:0
    };
  }
  db.rounds.push(nr);

  hd.forEach(h=>{
    if(h.first_putt_distance_ft==null || h.putts==null)return;
    db.puttingDetails.push({
      date:r.date,
      course:c.name,
      hole:h.hole,
      distance:Number(h.first_putt_distance_ft),
      putts:Number(h.putts),
      sg:h.putting_sg==null?0:Number(h.putting_sg),
      supabaseImportId:importId||null
    });
  });
  return {added:true,reason:'added',course:c};
}
async function syncSupabaseRounds(){
  const pill=document.getElementById('syncPill'),txt=document.getElementById('syncText');
  try{
    if(txt)txt.textContent='Syncing';
    if(pill){pill.classList.remove('ok','err')}
    const result=await callImportFunction({action:'list'});
    let added=0,unmapped=0;
    const unmappedNames=[];
    for(const row of result.imports||[]){
      const merged=mergeImportedRound(row.parsed,row.id);
      if(merged?.added)added++;
      if(merged?.reason==='unmapped'){
        unmapped++;
        unmappedNames.push(merged.courseName);
      }
    }
    db.rounds.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    db.puttingDetails.sort((a,b)=>String(a.date).localeCompare(String(b.date))||Number(a.hole)-Number(b.hole));
    if(unmapped){
      if(pill)pill.classList.add('err');
      if(txt)txt.textContent=`${unmapped} needs course`;
      console.warn('GolfIQ imports needing course mapping:',unmappedNames);
    }else{
      if(pill)pill.classList.add('ok');
      if(txt)txt.textContent=`Synced${added?` +${added}`:''}`;
    }
    render();
    return {added,unmapped};
  }catch(e){
    if(pill)pill.classList.add('err');
    if(txt)txt.textContent='Offline data';
    console.warn('Supabase sync failed',e);
    return {added:0,unmapped:0,error:e};
  }
}

document.getElementById('analyzeImport').onclick=async()=>{
  const files=[...fileInput.files];
  if(!files.length){alert('Choose at least one screenshot.');return;}
  const btn=document.getElementById('analyzeImport');
  try{
    btn.disabled=true;btn.textContent='Analyzing…';
    importStatus.className='import-status';importStatus.textContent='Preparing screenshots…';
    const images=[];
    for(let i=0;i<files.length;i++){
      importStatus.textContent=`Preparing screenshot ${i+1} of ${files.length}…`;
      images.push(await compressImage(files[i]));
    }
    importStatus.textContent='Reading round data…';
    const result=await callImportFunction({
      action:'parse',
      source:document.getElementById('sourceSelect').value,
      note:document.getElementById('importNote').value,
      images
    });
    pendingImport=result;
    importReview.innerHTML=reviewHtml(result);
    uploadStep.style.display='none';reviewStep.style.display='';
  }catch(e){
    importStatus.className='import-status error';
    importStatus.textContent=e.message;
  }finally{
    btn.disabled=false;btn.textContent='Analyze Screenshots';
  }
};
document.getElementById('saveImport').onclick=async()=>{
  if(!pendingImport)return;
  const r=pendingImport.round||pendingImport;
  const sig=importSignature(r);
  const embedded=embeddedRoundSignatures();
  if(embedded.has(sig)){
    const ok=confirm('This round appears to already exist in GolfIQ. Save it to Supabase anyway?');
    if(!ok)return;
  }
  const btn=document.getElementById('saveImport');
  try{
    btn.disabled=true;btn.textContent='Saving…';
    const result=await callImportFunction({action:'save',parsed:pendingImport});
    if(result.duplicate){
      alert('Duplicate detected. This round is already saved in GolfIQ.');
      btn.disabled=false;btn.textContent='Save Round';
      return;
    }
    btn.textContent='Saved ✓';
    const syncResult=await syncSupabaseRounds();
    if(syncResult?.unmapped){
      alert('The round was saved to Supabase, but GolfIQ still needs a course match before it can appear in analytics.');
    }
    setTimeout(()=>{dlg.close()},400);
  }catch(e){
    alert(e.message);
    btn.disabled=false;btn.textContent='Save Round';
  }
};
render();
syncSupabaseRounds();
