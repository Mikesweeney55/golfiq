<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>GolfIQ v7</title>
  <style>
:root{
  --bg:#0d1412;
  --panel:#15201c;
  --panel2:#1d2b26;
  --line:#2a3a34;
  --text:#f5f7f6;
  --muted:#9eb0a8;
  --accent:#b8ea68;
  --accent2:#83c94f;
  --warning:#ffd400;
  --danger:#ff3b30;
  --good:#23c552;
  --shadow:0 14px 32px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% -10%,#1b3228 0,#0d1412 38%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app-shell{max-width:920px;margin:0 auto;min-height:100vh;padding:18px 18px 96px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:800}
h1,h2,h3,p{margin-top:0}.topbar h1{margin:2px 0 0;font-size:30px}.hero h2{font-size:34px;line-height:1.08;margin-bottom:8px}.hero{padding:26px;border:1px solid var(--line);background:linear-gradient(145deg,#1b2a24,#111a17);border-radius:26px;box-shadow:var(--shadow);margin-bottom:16px}.hero-copy{max-width:650px}.muted{color:var(--muted)}
.button{border:0;border-radius:13px;padding:11px 15px;font-weight:800}.button.primary{background:var(--accent);color:#15200f}.button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:rgba(21,32,28,.92);border:1px solid var(--line);border-radius:20px;padding:18px}.card h3{margin-bottom:6px}.metric{font-size:30px;font-weight:850;letter-spacing:-.04em}.metric-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{border:1px solid var(--line);background:#13211b;border-radius:999px;padding:7px 10px;color:#dbe5e0;font-size:13px}.chip.good{border-color:#315d46;color:var(--good)}.chip.warn{border-color:#6c5a2c;color:var(--warning)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 10px}.section-head h2{margin:0;font-size:20px}.section-head p{margin:0}.course-select{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.course-pill{white-space:nowrap;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px}.course-pill.active{background:var(--accent);color:#14200f;border-color:var(--accent)}
.key-list{display:grid;gap:10px}.key{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.key:last-child{border-bottom:0}.key-num{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#21372d;color:var(--accent);font-weight:900;flex:0 0 auto}.key strong{display:block;margin-bottom:3px}
.hole-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.hole-card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;position:relative}.hole-card.risk-low{border-color:#23c552}.hole-card.risk-medium{border-color:#f2d335}.hole-card.risk-high{border-color:#ff4d4f}.hole-top{display:flex;justify-content:space-between;align-items:center}.hole-number{font-size:22px;font-weight:900}.risk-dot{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:900;line-height:1;background:var(--good);color:#06210d;border:2px solid rgba(255,255,255,.22)}.risk-medium .risk-dot{background:var(--warning);color:#2a2200}.risk-high .risk-dot{background:var(--danger);color:#fff}.hole-score{font-size:18px;font-weight:800;margin-top:8px}.history{color:var(--muted);font-size:12px;margin-top:4px}.strategy{margin-top:9px;color:#dce6e1;font-size:13px}.risk-legend{display:flex;gap:8px;flex-wrap:wrap}.risk-legend .chip{display:inline-flex;align-items:center;gap:8px}.risk-legend .risk-dot{width:22px;height:22px;font-size:11px;flex:0 0 auto}
.round-row{display:grid;grid-template-columns:1.3fr .7fr .5fr .7fr;gap:8px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.round-row:last-child{border-bottom:0}.score-big{font-size:22px;font-weight:900}.badge{display:inline-flex;align-items:center;justify-content:center;min-width:52px;border-radius:999px;padding:5px 8px;background:#24352e;color:#dce8e2;font-size:12px}.score-strip{display:flex;gap:5px;overflow-x:auto;padding:8px 0}
.score-box{min-width:34px;height:34px;display:grid;place-items:center;background:transparent;border:0;font-weight:900;position:relative;color:var(--text)}
.score-box.birdie{border:2px solid #dfe9e3;border-radius:50%}
.score-box.eagle{border:2px solid #dfe9e3;border-radius:50%;box-shadow:0 0 0 3px #16221d,0 0 0 5px #dfe9e3}
.score-box.bogey{border:2px solid #dfe9e3;border-radius:0}
.score-box.double{border:2px solid #dfe9e3;border-radius:0;box-shadow:0 0 0 3px #16221d,0 0 0 5px #dfe9e3}
.score-box.worse{border:2px solid #ff8b7a;border-radius:0;box-shadow:0 0 0 3px #16221d,0 0 0 5px #ff8b7a}
.pregame-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.pregame-stat{border:1px solid var(--line);background:#13211b;border-radius:14px;padding:9px 8px;text-align:center}
.pregame-stat strong{display:block;font-size:18px;line-height:1.1}.pregame-stat span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.stat-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.stat-tab{white-space:nowrap;border:1px solid var(--line);background:#13211b;color:#dbe5e0;border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px}.stat-tab.active{background:var(--accent);color:#14200f;border-color:var(--accent)}
.chart-card{padding:16px 14px 12px}.chart-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}.chart-head strong{font-size:18px}.chart-head .muted{font-size:12px}.round-chart-wrap{overflow-x:auto;padding:6px 2px 2px;scroll-behavior:smooth}.round-chart{height:240px;min-width:max(100%,calc(var(--bars,12) * 44px));display:flex;align-items:stretch;gap:6px;border-bottom:1px solid var(--line);padding:0 4px}.bar-col{width:38px;flex:0 0 38px;display:grid;grid-template-rows:1fr 52px;gap:4px;align-items:end}.bar-track{height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}.bar{width:28px;min-height:4px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,var(--accent),var(--accent2));box-shadow:0 0 0 1px rgba(255,255,255,.03) inset}.bar-value{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:#e8efe9;white-space:nowrap}.bar-label{text-align:center;font-size:10px;color:var(--muted);line-height:1.15}.bar-label strong{display:block;color:#dbe5e0;font-size:10px;white-space:nowrap}.chart-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chart-summary .badge{min-width:auto}
.bottom-nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(720px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);background:rgba(18,27,24,.95);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:7px;box-shadow:var(--shadow)}.nav-item{border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:14px}.nav-item span{display:block;font-size:18px}.nav-item small{font-size:11px}.nav-item.active{background:#24342e;color:var(--text)}
dialog{border:0;padding:0;background:transparent;color:var(--text);width:min(620px,calc(100% - 28px))}dialog::backdrop{background:rgba(0,0,0,.72)}.dialog-card{background:#16221d;border:1px solid var(--line);border-radius:22px;padding:22px}.dialog-head{display:flex;justify-content:space-between;align-items:flex-start}.icon-button{border:0;background:transparent;color:var(--text);font-size:20px}.upload-zone{display:grid;gap:4px;text-align:center;border:1px dashed #52685d;border-radius:18px;padding:26px;margin:18px 0;background:#111b17}.upload-zone input{display:none}.upload-zone span{font-size:12px;color:var(--muted)}label{display:grid;gap:6px;margin-top:12px;color:#dbe5e0;font-weight:700}input,select{background:#0e1714;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.file-list{display:grid;gap:6px}.file-item{font-size:12px;color:var(--muted);padding:7px 9px;background:#101914;border-radius:10px}
.note{border-left:3px solid var(--accent);padding-left:12px;color:#dce7e2}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:700px){.app-shell{padding:14px 12px 98px}.hero{padding:20px}.hero h2{font-size:28px}.grid.two,.grid.three{grid-template-columns:1fr 1fr}.hole-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.round-row{grid-template-columns:1.2fr .6fr .6fr}.round-row .optional{display:none}}


.filter-tabs,.game-tabs,.putting-rounds{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.filter-tab,.game-tab,.putting-round{white-space:nowrap;border:1px solid var(--line);background:#13211b;color:#dbe5e0;border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px}
.filter-tab.active,.game-tab.active,.putting-round.active{background:var(--accent);color:#14200f;border-color:var(--accent)}
.chart-scale{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px}
.y-axis{height:240px;display:flex;flex-direction:column;justify-content:space-between;padding:3px 0 52px;color:var(--muted);font-size:10px;text-align:right}
.round-chart.true-scale{position:relative;background-image:linear-gradient(to top,transparent 24%,rgba(255,255,255,.04) 25%,transparent 26%,transparent 49%,rgba(255,255,255,.04) 50%,transparent 51%,transparent 74%,rgba(255,255,255,.04) 75%,transparent 76%)}
.nine-marker{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warning);margin-left:3px;vertical-align:middle}
.putting-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.putting-green{position:relative;max-width:700px;margin:14px auto 2px;aspect-ratio:1.06/1;border-radius:46% 46% 40% 40%;overflow:hidden;border:7px solid #244e25;background:radial-gradient(ellipse at 50% 28%,#b7e681 0 20%,#9dd66c 21% 46%,#75bd4e 47% 72%,#3f8f38 73% 100%);box-shadow:inset 0 0 50px rgba(0,0,0,.28)}
.heat-ring{position:absolute;left:50%;transform:translateX(-50%);border:3px solid rgba(255,255,255,.86);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;color:#0e1714;font-weight:800;padding:4px;overflow:hidden}.heat-ring>div{max-width:86%;line-height:1.05}
.heat-ring .zone-title{font-size:17px;line-height:1}.heat-ring .zone-detail{font-size:11px;line-height:1.05;margin-top:3px;font-weight:800;white-space:nowrap}.heat-ring .zone-sg{font-size:12px;margin-top:2px;white-space:nowrap}
.heat-ring.no-data{background:rgba(215,215,215,.9)!important;color:#404543}
.zone1{top:5%;width:42%;height:27%;z-index:6}.zone2{top:22%;width:58%;height:34%;z-index:5}.zone3{top:42%;width:70%;height:30%;z-index:4}.zone4{top:55%;width:82%;height:31%;z-index:3}.zone5{top:68%;width:94%;height:28%;z-index:2}.zone6{top:81%;width:98%;height:18%;z-index:1}
.heat-excellent{background:rgba(20,111,38,.93);color:white}.heat-good{background:rgba(164,215,91,.93)}.heat-average{background:rgba(255,210,91,.94)}.heat-poor{background:rgba(235,112,82,.92);color:white}
.heat-key{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.heat-key .chip{display:flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.excellent{background:#146f26}.dot.good{background:#a4d75b}.dot.average{background:#ffd25b}.dot.poor{background:#eb7052}.dot.nodata{background:#bcbcbc}
.multi-note{font-size:12px;color:var(--muted);margin:0 0 8px}
@media(max-width:700px){.chart-scale{grid-template-columns:34px minmax(0,1fr)}.y-axis{font-size:9px}.putting-summary{grid-template-columns:1fr 1fr}.heat-ring .zone-title{font-size:12px}.heat-ring .zone-detail{font-size:9px}.heat-ring .zone-sg{font-size:10px}.zone6 .zone-title{font-size:11px}.zone6 .zone-detail{font-size:8px}}


.round-row.round-summary{grid-template-columns:minmax(180px,1fr) .35fr .55fr;border-radius:12px;padding-left:10px;padding-right:10px;transition:background .16s ease,box-shadow .16s ease}
.round-row.round-summary.selected{background:#1d3027;box-shadow:inset 4px 0 0 var(--accent)}
.bar-col[data-round-bar]{cursor:pointer;border-radius:10px;transition:background .15s ease,box-shadow .15s ease}
.bar-col[data-round-bar]:hover{background:rgba(184,234,104,.06)}
.bar-col[data-round-bar].selected{background:rgba(184,234,104,.10);box-shadow:inset 0 0 0 1px rgba(184,234,104,.42)}
.bar-col[data-round-bar]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:700px){.round-row.round-summary{grid-template-columns:minmax(150px,1fr) .35fr .55fr}}

/* GolfIQ mobile heat map v2: non-overlapping distance bands */
.heat-map-grid{display:grid;gap:8px;margin-top:14px}
.heat-band{display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:10px;min-height:54px;padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.16);color:#0e1714;font-weight:800}
.heat-band .band-label{font-size:16px;white-space:nowrap}
.heat-band .band-sample{font-size:12px;opacity:.82;font-weight:700}
.heat-band .band-sg{font-size:15px;white-space:nowrap;text-align:right}
.heat-band.no-data{background:#cfd4d0!important;color:#3f4743}
@media(max-width:700px){.heat-band{grid-template-columns:72px 1fr auto;min-height:48px;padding:9px 10px}.heat-band .band-label{font-size:14px}.heat-band .band-sample{font-size:11px}.heat-band .band-sg{font-size:13px}}

</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">AI GOLF CADDIE</div>
        <h1>GolfIQ <span style="font-size:.45em;color:var(--muted);font-weight:800;vertical-align:middle">v7</span></h1>
      </div>
      <button id="importBtn" class="button secondary">Import Round</button>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav">
      <button data-view="pregame" class="nav-item active"><span>⛳</span><small>Pregame</small></button>
      <button data-view="memory" class="nav-item"><span>🧠</span><small>Course Memory</small></button>
      <button data-view="rounds" class="nav-item"><span>📊</span><small>Rounds</small></button>
      <button data-view="game" class="nav-item"><span>🏌️</span><small>My Game</small></button>
    </nav>
  </div>

  <dialog id="importDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head">
        <div>
          <div class="eyebrow">ROUND IMPORT</div>
          <h2>Add screenshots</h2>
        </div>
        <button class="icon-button" value="cancel">✕</button>
      </div>
      <p class="muted">Screenshot import is still a prototype control. The canonical GolfIQ database is maintained separately.</p>
      <label class="upload-zone">
        <input id="fileInput" type="file" accept="image/*" multiple />
        <strong>Select screenshots</strong>
        <span>18Birdies, Garmin, Arccos, Golfshot, TheGrint, or any scorecard image</span>
      </label>
      <div id="fileList" class="file-list"></div>
      <label>Source app
        <select id="sourceSelect">
          <option>18Birdies</option>
          <option>Garmin Golf</option>
          <option>Arccos</option>
          <option>Golfshot</option>
          <option>TheGrint</option>
          <option>Other</option>
        </select>
      </label>
      <label>Optional note
        <input id="importNote" placeholder="e.g. Butter Brook white tees" />
      </label>
      <div class="dialog-actions">
        <button class="button secondary" value="cancel">Cancel</button>
        <button id="saveImport" type="button" class="button primary">Save Import</button>
      </div>
    </form>
  </dialog>

  const gir=rs.flatMap(r=>r.gir||[]), fw=rs.flatMap(r=>r.fairways||[]), putts=rs.map(r=>sum(r.putts)).filter(Number.isFinite);
  return {rounds:rs,gir:pct(gir),fw:pct(fw),putts:avg(putts),avgScore:avg(rs.map(r=>r.gross))};
}
function holeMemoryRecent(courseId,limit=3){
  const c=course(courseId), rounds=roundsFor(courseId).slice(0,limit);
  return c.pars.map((par,i)=>{
    const vals=rounds.map(r=>({score:r.scores[i],fw:r.fairways?.[i],gir:r.gir?.[i],putts:r.putts?.[i],chips:r.chips?.[i]})).filter(x=>x.score!=null);
    if(!vals.length) return null;
    const scores=vals.map(v=>v.score), over=scores.map(s=>s-par), avgScore=avg(scores);
    const doubleRate=Math.round(100*over.filter(x=>x>=2).length/scores.length);
    let risk='low'; if(avgScore-par>=1.3 || doubleRate>=40) risk='high'; else if(avgScore-par>=.7 || doubleRate>=20) risk='medium';
    return {hole:c.holeNumbers?.[i]??i+1,par,played:scores.length,avgScore,doubleRate,risk};
  }).filter(Boolean);
}
function scramblingPct(r){const c=course(r.courseId);let a=0,s=0;r.scores.forEach((score,i)=>{if(r.gir?.[i]===0){a++;if(score<=c.pars[i])s++;}});return a?100*s/a:null;}
function riskLabel(h){return h.risk==='high'?'High risk':h.risk==='medium'?'Medium risk':'Low risk'}
function riskLetter(h){return h.risk==='high'?'H':h.risk==='medium'?'M':'L'}
function scoreClass(score,par){const d=score-par; return d<=-2?'eagle':d===-1?'birdie':d===1?'bogey':d===2?'double':d>=3?'worse':''}


function sortedCourses(){
  return db.courses.slice().sort((a,b)=>a.name.localeCompare(b.name));
}
function parTypeSummary(courseId,limit=3){
  const c=course(courseId);
  const rs=roundsFor(courseId).slice(0,limit);
  const by={3:[],4:[],5:[]};
  rs.forEach(r=>r.scores.forEach((s,i)=>{const p=c.pars[i]; if(by[p]) by[p].push(s-p);}));
  return Object.fromEntries(Object.entries(by).map(([p,v])=>[p,v.length?avg(v):null]));
}
function deepPregameInsights(courseId){
  const c=course(courseId), all=roundsFor(courseId), recent=all.slice(0,3), prior=all.slice(3);
  const recentAvg=recent.length?avg(recent.map(r=>r.gross)):null;
  const priorAvg=prior.length?avg(prior.map(r=>r.gross)):null;
  const mem=holeMemoryRecent(courseId,3);
  const worst=mem.slice().sort((a,b)=>(b.avgScore-b.par)-(a.avgScore-a.par))[0];
  const pars=parTypeSummary(courseId,3);
  const parEntries=Object.entries(pars).filter(([,v])=>v!=null).sort((a,b)=>b[1]-a[1]);
  const weakPar=parEntries[0];
  const scrVals=recent.map(scramblingPct).filter(v=>v!=null);
  const scr=scrVals.length?avg(scrVals):null;
  const girVals=recent.flatMap(r=>r.gir||[]).filter(v=>v!=null);
  const gir=girVals.length?pct(girVals):null;
  const putts=recent.length?avg(recent.map(r=>sum(r.putts))):null;

  const keys=[];
  if(recentAvg!=null){
    if(priorAvg!=null){
      const delta=recentAvg-priorAvg;
      keys.push({
        title: delta<=-1 ? 'You are scoring better here' : delta>=1 ? 'Recent scoring has slipped' : 'Scoring is holding steady',
        text:`Last ${recent.length}: ${recent.map(r=>r.gross).join(', ')} · ${Math.abs(delta).toFixed(1)} stroke${Math.abs(delta)>=1.95?'s':''} ${delta<0?'better':'worse'} than your earlier average.`
      });
    } else {
      keys.push({title:'Current scoring baseline',text:`Last ${recent.length}: ${recent.map(r=>r.gross).join(', ')} · ${recentAvg.toFixed(1)} average.`});
    }
  }
  if(worst){
    keys.push({
      title:`Hole ${worst.hole} is the clearest leak`,
      text:`Recent avg ${worst.avgScore.toFixed(1)} on par ${worst.par}${worst.doubleRate?` · ${worst.doubleRate}% double+`:''}. Treat bogey as acceptable if position gets shaky.`
    });
  }
  if(weakPar){
    const [p,over]=weakPar;
    const supporting = [`Par-${p}s are costing the most at +${over.toFixed(1)} per hole`];
    if(gir!=null) supporting.push(`GIR ${gir}%`);
    if(scr!=null) supporting.push(`scrambling ${Math.round(scr)}%`);
    if(putts!=null) supporting.push(`${putts.toFixed(1)} putts`);
    keys.push({title:`Your scoring pattern: par-${p}s`,text:supporting.join(' · ')+'.'});
  }
  while(keys.length<3) keys.push({title:'Keep the plan simple',text:'Not enough course-specific history yet for a deeper third trend.'});
  return keys.slice(0,3);
}

function pregame(){
  const c=course(state.selectedCourseId), rounds=roundsFor(c.id), mem=holeMemory(c.id), cs=recentCourseSummary(c.id,3);
  const latest=rounds[0], keys=deepPregameInsights(c.id);
  return `
    <div class="section-head" style="margin-top:0"><div><div class="eyebrow">NEXT ROUND</div><h2>Choose course</h2></div></div>
    <div class="course-select">${sortedCourses().map(x=>`<button class="course-pill ${x.id===c.id?'active':''}" data-course="${x.id}">${x.name}</button>`).join('')}</div>

    <section class="hero" style="margin-top:14px">
      <div class="hero-copy"><div class="eyebrow">TOMORROW'S PREGAME</div><h2>${c.name}</h2>
      <p class="muted">${c.tees} tees · Par ${c.par} · ${c.rating}/${c.slope} · ${rounds.length} round${rounds.length===1?'':'s'} in memory</p>
      <div class="pregame-stats">
        <div class="pregame-stat"><strong>${cs.fw??'—'}%</strong><span>Fairways</span></div>
        <div class="pregame-stat"><strong>${cs.gir??'—'}%</strong><span>GIR</span></div>
        <div class="pregame-stat"><strong>${cs.putts!=null?cs.putts.toFixed(1):'—'}</strong><span>Putts</span></div>
      </div></div>
    </section>

    <div class="section-head"><div><div class="eyebrow">3 INSIGHTS · LAST ${Math.min(3,rounds.length)||0} HERE</div><h2>What matters tomorrow</h2></div></div>
    <div class="card key-list">${keys.map((k,i)=>`<div class="key"><div class="key-num">${i+1}</div><div><strong>${k.title}</strong><span class="muted">${k.text}</span></div></div>`).join('')}</div>

    <div class="section-head"><div><div class="eyebrow">COURSE MEMORY</div><h2>Holes to know</h2></div><button class="button secondary" onclick="setView('memory')">See all</button></div>
    <div class="risk-legend"><span class="chip"><span class="risk-dot">L</span> Low risk</span><span class="chip"><span class="risk-dot" style="background:var(--warning);color:#2a2200">M</span> Medium risk</span><span class="chip"><span class="risk-dot" style="background:var(--danger);color:#fff">H</span> High risk</span></div>
    <div class="hole-grid">${mem.slice(0,6).map(renderHoleCard).join('')}</div>

    ${latest?`<div class="section-head"><div><div class="eyebrow">LAST TIME HERE</div><h2>${fmtDate(latest.date)} · ${latest.gross}</h2></div></div>
    <div class="card">
      <div class="score-strip">${latest.scores.map((s,i)=>`<div class="score-box ${scoreClass(s,c.pars[i])}" title="Hole ${c.holeNumbers?.[i]??i+1} · Par ${c.pars[i]}">${s}</div>`).join('')}</div>
      <div class="muted" style="font-size:11px;margin-top:8px">Scorecard symbols: circle birdie · square bogey · double outline double bogey · no outline par</div>
    </div>`:''}
  `;
}

function renderHoleCard(h){return `<div class="hole-card risk-${h.risk}"><div class="hole-top"><div><span class="hole-number">${h.hole}</span> <span class="muted">Par ${h.par}</span></div><span class="risk-dot" title="${riskLabel(h)}">${riskLetter(h)}</span></div><div class="hole-score">Avg ${h.avgScore.toFixed(1)}</div><div class="history">Scores: ${h.recent.join(', ')} · GIR ${h.gir??'—'}%</div><div class="strategy">${h.strategy}</div></div>`}

function memory(){
  const c=course(state.selectedCourseId), mem=holeMemory(c.id);
  return `<div class="section-head"><div><div class="eyebrow">HOLE-BY-HOLE MEMORY</div><h2>${c.name}</h2></div></div>
  <div class="course-select">${sortedCourses().map(x=>`<button class="course-pill ${x.id===c.id?'active':''}" data-course="${x.id}">${x.name}</button>`.join('')}</div>
  <div class="risk-legend"><span class="chip"><span class="risk-dot">L</span> Low risk</span><span class="chip"><span class="risk-dot" style="background:var(--warning);color:#2a2200">M</span> Medium risk</span><span class="chip"><span class="risk-dot" style="background:var(--danger);color:#fff">H</span> High risk</span></div>
  <div class="hole-grid">${mem.map(renderHoleCard).join('')}</div>`;
}

function scoreDifferential(r){
 const c=course(r.courseId);
 if(r.holes!==18 || !c || !Number.isFinite(c.rating) || !Number.isFinite(c.slope) || !c.slope)return null;
 // WHS 18-hole differential, using recorded gross as adjusted gross and PCC=0.
 return (r.gross-c.rating)*113/c.slope;
}

const roundStatDefs={
 score:{label:'Score',short:'Score',domain:[70,100],value:r=>r.holes===18?r.gross:null,better:'low',fmt:v=>Math.round(v)},
 scoreToPar:{label:'Score vs par',short:'Vs Par',domain:[0,25],value:r=>r.scoreToPar,better:'low',fmt:v=>(v>=0?'+':'')+Math.round(v)},
 differential:{label:'Score differential',short:'Diff',domain:[0,25],value:r=>scoreDifferential(r),better:'low',fmt:v=>v.toFixed(1)},
 gir:{label:'Greens in regulation',short:'GIR',domain:[0,100],value:r=>100*sum(r.gir)/(r.gir?.length||1),better:'high',fmt:v=>Math.round(v)+'%'},
 fairways:{label:'Fairways hit',short:'FW',domain:[0,100],value:r=>{const a=(r.fairways||[]).filter(x=>x!=null);return a.length?100*sum(a)/a.length:null},better:'high',fmt:v=>Math.round(v)+'%'},
 putts:{label:'Putts',short:'Putts',domain:[20,45],value:r=>r.holes===18?sum(r.putts):null,better:'low',fmt:v=>Math.round(v)},
 chips:{label:'Chip shots',short:'Chips',domain:[0,20],value:r=>r.holes===18?sum(r.chips):null,better:'low',fmt:v=>Math.round(v)},
 penalties:{label:'Penalty strokes',short:'Pen',domain:[0,6],value:r=>r.holes===18?sum(r.penalties):null,better:'low',fmt:v=>Math.round(v)},
 scrambling:{label:'Scrambling',short:'Scramble',domain:[0,100],value:r=>scramblingPct(r),better:'high',fmt:v=>Math.round(v)+'%'}
};
function statValue(r,key){const d=roundStatDefs[key]||roundStatDefs.score,v=d.value(r);return Number.isFinite(v)?v:null}
function filteredRounds(){let rs=db.rounds.slice();if(state.roundFilter==='18')rs=rs.filter(r=>r.holes===18);if(state.roundFilter==='9')rs=rs.filter(r=>r.holes===9);return rs.sort((a,b)=>b.date.localeCompare(a.date))}
function roundsChart(rounds,key){
 const d=roundStatDefs[key],chrono=rounds.slice().sort((a,b)=>a.date.localeCompare(b.date)),vals=chrono.map(r=>statValue(r,key)).filter(v=>v!=null);
 if(!vals.length)return `<div class="card empty">No comparable data for this metric in the selected rounds.</div>`;
 let [min,max]=d.domain;if(Math.min(...vals)<min)min=Math.floor(Math.min(...vals)/5)*5;if(Math.max(...vals)>max)max=Math.ceil(Math.max(...vals)/5)*5;
 const range=Math.max(max-min,1),av=avg(vals),best=d.better==='high'?Math.max(...vals):Math.min(...vals),ticks=[max,min+range*.75,min+range*.5,min+range*.25,min];
 const bars=chrono.map(r=>{const v=statValue(r,key),h=v==null?0:Math.max(1,Math.min(100,100*(v-min)/range)),sel=String(state.selectedRoundId)===String(r.id);return `<div class="bar-col ${sel?'selected':''}" data-round-bar="${r.id}" role="button" tabindex="0" aria-label="${fmtDate(r.date)}, ${v==null?'no value':d.fmt(v)}"><div class="bar-track"><div class="bar-value" style="bottom:calc(${h}% + 6px)">${v==null?'—':d.fmt(v)}</div><div class="bar" style="height:${h}%"></div></div><div class="bar-label"><strong>${shortDate(r.date)}${r.holes===9?'<span class="nine-marker"></span>':''}</strong></div></div>`}).join('');
 const latest=chrono.at(-1),lv=latest?statValue(latest,key):null;
 return `<div class="card chart-card"><div class="chart-head"><div><div class="eyebrow">ROUND-BY-ROUND TREND</div><strong>${d.label}</strong></div></div><div class="chart-scale"><div class="y-axis">${ticks.map(v=>`<span>${d.fmt(v)}</span>`).join('')}</div><div class="round-chart-wrap"><div class="round-chart true-scale" style="--bars:${chrono.length}">${bars}</div></div></div><div class="chart-summary"><span class="badge">Average ${d.fmt(av)}</span><span class="badge">Best ${d.fmt(best)}</span><span class="badge">Latest ${lv==null?'—':d.fmt(lv)}</span></div></div>`;
}
function roundsView(){
 const sorted=filteredRounds(),key=state.roundStat||'score',d=roundStatDefs[key];
 return `<div class="section-head"><div><div class="eyebrow">ROUND DATABASE</div><h2>${db.rounds.length} imported rounds</h2></div></div>
 <div class="stat-tabs">${Object.entries(roundStatDefs).map(([k,x])=>`<button class="stat-tab ${k===key?'active':''}" data-round-stat="${k}">${x.short}</button>`).join('')}</div>
 <div class="filter-tabs"><button class="filter-tab ${state.roundFilter==='18'?'active':''}" data-round-filter="18">18 holes</button><button class="filter-tab ${state.roundFilter==='all'?'active':''}" data-round-filter="all">All</button><button class="filter-tab ${state.roundFilter==='9'?'active':''}" data-round-filter="9">9 holes</button></div>
 ${roundsChart(sorted,key)}
 <div class="section-head"><div><div class="eyebrow">ROUND LIST</div><h2>Score by round</h2></div></div><div class="card">${sorted.map(r=>{const c=course(r.courseId),diff=scoreDifferential(r),sel=String(state.selectedRoundId)===String(r.id);return `<div class="round-row round-summary ${sel?'selected':''}" data-round-row="${r.id}"><div><strong>${c.name}</strong><div class="muted">${fmtDate(r.date)} · ${c.tees} tees · Par ${c.par} · ${r.holes} holes</div></div><div class="score-big">${r.gross}</div><div><span class="badge">Diff ${diff==null?'—':diff.toFixed(1)}</span></div></div>`}).join('')}</div>`;
}
function detailedPuttingRounds(){return [...new Set(db.puttingDetails.map(p=>p.date+'|'+p.course))].sort().reverse()}
function selectedPutting(){return db.puttingDetails.filter(p=>state.puttingSelections.has(p.date+'|'+p.course))}
function heatTone(sg,n){if(!n)return 'no-data';if(sg>=.30)return 'heat-excellent';if(sg>=.10)return 'heat-good';if(sg>=-.09)return 'heat-average';return 'heat-poor'}
function heatMap(){
 const p=selectedPutting(),bins=[['0–3 ft',0,3],['4–6 ft',3,6],['7–10 ft',6,10],['11–20 ft',10,20],['21–40 ft',20,40],['40+ ft',40,9999]];
 const stats=bins.map(([label,lo,hi])=>{const a=p.filter(x=>x.distance>lo&&x.distance<=hi),n=a.length,sg=n?avg(a.map(x=>x.sg)):null;return {label,n,sg}});
 const rows=stats.map(z=>`<div class="heat-band ${heatTone(z.sg,z.n)} ${z.n?'':'no-data'}"><div class="band-label">${z.label}</div><div class="band-sample">${z.n?`${z.n} putt${z.n===1?'':'s'}`:'No data'}</div><div class="band-sg">${z.n?`SG ${z.sg>=0?'+':''}${z.sg.toFixed(2)}`:'—'}</div></div>`).join('');
 const total=p.length,ones=p.filter(x=>x.putts===1).length,threes=p.filter(x=>x.putts>=3).length,best=stats.filter(x=>x.sg!=null).sort((a,b)=>b.sg-a.sg)[0];
 return `<div class="putting-summary"><div class="card"><div class="metric-label">Starts</div><div class="metric">${total}</div></div><div class="card"><div class="metric-label">1-putts</div><div class="metric">${ones}</div><div class="muted">${total?Math.round(100*ones/total):0}%</div></div><div class="card"><div class="metric-label">3-putts</div><div class="metric">${threes}</div></div><div class="card"><div class="metric-label">Best</div><div class="metric" style="font-size:20px">${best?.label||'—'}</div><div class="muted">${best?(best.sg>=0?'+':'')+best.sg.toFixed(2)+' SG':'—'}</div></div></div>
 <div class="card"><div class="eyebrow">PUTTING DISTANCE HEAT MAP</div><h3 style="margin-top:4px">First-putt distance</h3><div class="heat-map-grid">${rows}</div><div class="heat-key"><span class="chip"><span class="dot excellent"></span>Great</span><span class="chip"><span class="dot good"></span>Good</span><span class="chip"><span class="dot average"></span>Average</span><span class="chip"><span class="dot poor"></span>Poor</span></div></div>`;
}

function myGame(){
 const ps=playerSummary(),details=detailedPuttingRounds();
 return `<div class="section-head"><div><div class="eyebrow">PLAYER MODEL</div><h2>My Game</h2></div></div><div class="game-tabs"><button class="game-tab ${state.gameTab==='overview'?'active':''}" data-game-tab="overview">Overview</button><button class="game-tab ${state.gameTab==='putting'?'active':''}" data-game-tab="putting">Putting</button></div>
 ${state.gameTab==='overview'?`<div class="grid two"><div class="card"><div class="metric-label">18-hole average</div><div class="metric">${ps.avgScore?.toFixed(1)}</div></div><div class="card"><div class="metric-label">Fairways</div><div class="metric">${ps.fw}%</div></div><div class="card"><div class="metric-label">GIR</div><div class="metric">${ps.gir}%</div></div><div class="card"><div class="metric-label">Putts / round</div><div class="metric">${ps.putts?.toFixed(1)}</div></div></div><div class="section-head"><div><div class="eyebrow">CLUB MEMORY</div><h2>On-course distances</h2></div></div><div class="card">${db.clubStats.map(x=>`<div class="round-row"><div><strong>${x.club}</strong></div><div class="score-big">${x.distance}</div><div class="muted">yds</div></div>`).join('')}</div>`:
 `<div class="section-head"><div><div class="eyebrow">PUTTING TREND</div><h2>Putts by round</h2></div></div>${roundsChart(db.rounds.filter(r=>r.holes===18).sort((a,b)=>b.date.localeCompare(a.date)),'putts')}<div class="section-head"><div><div class="eyebrow">HEAT MAP</div><h2>Select detailed rounds</h2></div></div><div class="putting-rounds"><button class="putting-round ${state.puttingSelections.size===details.length?'active':''}" data-put-all="1">All detailed rounds</button>${details.map(k=>{const [d,c]=k.split('|');return `<button class="putting-round ${state.puttingSelections.has(k)?'active':''}" data-put-key="${k}">${shortDate(d)} · ${courseShort(c)}</button>`}).join('')}</div>${heatMap()}`}`;
}
function selectRoundFromBar(id){
 state.selectedRoundId=id;
 document.querySelectorAll('[data-round-bar]').forEach(x=>x.classList.toggle('selected',String(x.dataset.roundBar)===String(id)));
 document.querySelectorAll('[data-round-row]').forEach(x=>x.classList.toggle('selected',String(x.dataset.roundRow)===String(id)));
 const row=document.querySelector(`[data-round-row="${id}"]`);
 if(row)row.scrollIntoView({behavior:'smooth',block:'center'});
}
function render(){
 app.innerHTML=state.view==='pregame'?pregame():state.view==='memory'?memory():state.view==='rounds'?roundsView():myGame();
 document.querySelectorAll('[data-course]').forEach(b=>b.addEventListener('click',()=>{state.selectedCourseId=b.dataset.course;render()}));
 document.querySelectorAll('[data-round-stat]').forEach(b=>b.addEventListener('click',()=>{state.roundStat=b.dataset.roundStat;render()}));
 document.querySelectorAll('[data-round-filter]').forEach(b=>b.addEventListener('click',()=>{state.roundFilter=b.dataset.roundFilter;state.selectedRoundId=null;render()}));
 document.querySelectorAll('[data-round-bar]').forEach(b=>{b.addEventListener('click',()=>selectRoundFromBar(b.dataset.roundBar));b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectRoundFromBar(b.dataset.roundBar)}})});
 document.querySelectorAll('[data-game-tab]').forEach(b=>b.addEventListener('click',()=>{state.gameTab=b.dataset.gameTab;render()}));
 document.querySelectorAll('[data-put-key]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.putKey;if(state.puttingSelections.has(k))state.puttingSelections.delete(k);else state.puttingSelections.add(k);render()}));
 document.querySelectorAll('[data-put-all]').forEach(b=>b.addEventListener('click',()=>{const keys=detailedPuttingRounds();if(state.puttingSelections.size===keys.length)state.puttingSelections.clear();else state.puttingSelections=new Set(keys);render()}));
 document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
 if(state.view==='rounds'||(state.view==='game'&&state.gameTab==='putting'))requestAnimationFrame(()=>document.querySelectorAll('.round-chart-wrap').forEach(w=>w.scrollLeft=w.scrollWidth));
}
window.setView = v => {state.view=v; render();};
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));

const dlg=document.getElementById('importDialog'), fileInput=document.getElementById('fileInput'), fileList=document.getElementById('fileList');
document.getElementById('importBtn').onclick=()=>dlg.showModal();
fileInput.addEventListener('change',()=>{fileList.innerHTML=[...fileInput.files].map(f=>`<div class="file-item">${f.name} · ${(f.size/1024/1024).toFixed(1)} MB</div>`).join('')});
document.getElementById('saveImport').onclick=()=>{
  const files=[...fileInput.files]; if(!files.length){alert('Choose at least one screenshot.');return;}
  const imports=JSON.parse(localStorage.getItem('roundiq_imports')||'[]');
  imports.push({createdAt:new Date().toISOString(),source:document.getElementById('sourceSelect').value,note:document.getElementById('importNote').value,files:files.map(f=>({name:f.name,size:f.size,type:f.type}))});
  localStorage.setItem('roundiq_imports',JSON.stringify(imports)); dlg.close(); fileInput.value='';fileList.innerHTML='';document.getElementById('importNote').value=''; alert('Import staged locally. It is not yet written into the canonical GolfIQ database.');
};
render();
